<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bunt Cakes Team</title><style>:root{--a:#15803d;--bg:#f7fff8;--c:#fff;--l:#d1d5db;--m:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#1f2937}.app{max-width:900px;margin:auto;padding:14px 12px 70px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.stack{display:grid;gap:10px}.row{display:flex;gap:8px;justify-content:space-between;align-items:center}.wrap{flex-wrap:wrap}.muted{color:var(--m)}.big{font-size:2rem;font-weight:800}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:.82rem}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}.tabs button{white-space:nowrap}.tabs .on{background:var(--a);color:#fff}.hidden{display:none!important}button{font:inherit;border:1px solid var(--l);background:#fff;border-radius:12px;padding:10px;min-height:44px}.primary{background:var(--a);color:#fff;border-color:var(--a)}.event{border-left:5px solid var(--a)}.tr{display:grid;grid-template-columns:1.5fr repeat(4,.7fr);gap:8px;min-width:520px;padding:8px;border-top:1px solid var(--l)}.tr:first-child{border-top:0}.head{font-weight:700;color:var(--m);font-size:.82rem}.num{text-align:center}.table{overflow:auto}.error{color:#991b1b}@media(max-width:650px){.g2,.g3{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="row wrap"><div><h1 style="margin:.2rem 0">Bunt Cakes</h1><div class="muted">Live Team View</div></div><div><span id="updated" class="pill">Loading…</span> <button id="refresh">Refresh</button></div></div><div id="error" class="card error hidden" style="margin-top:10px"></div><div class="tabs"><button class="on" data-tab="home">Home</button><button data-tab="schedule">Schedule</button><button data-tab="lineup">Lineup</button><button data-tab="kicking">Kicking Order</button><button data-tab="officials">Officiating</button></div><section id="home" class="stack"><div class="grid g3"><div class="card"><div class="muted">Bunt Cakes</div><div id="teamScore" class="big">0</div></div><div class="card"><div class="muted">Opponent</div><div id="oppScore" class="big">0</div></div><div class="card"><div class="muted">Inning</div><div id="inning" class="big">1</div><div id="half" class="muted"></div></div></div><div id="next" class="card event"></div><div class="card"><strong>Today’s fielding lineup</strong><div id="homeLineup" class="grid g2" style="margin-top:10px"></div></div></section><section id="schedule" class="stack hidden"><div class="card"><strong>Schedule</strong><div class="muted">Official games, officiating slots, practices, socials and team events.</div></div><div id="events" class="stack"></div></section><section id="lineup" class="stack hidden"><div class="card"><strong>Defensive Lineup</strong><div id="lineupLabel" class="muted"></div></div><div id="positions" class="grid g2"></div></section><section id="kicking" class="stack hidden"><div class="card"><strong>Kicking Order</strong></div><div id="kickList" class="stack"></div></section><section id="officials" class="stack hidden"><div class="card"><strong>Officiating Tracker</strong><div class="muted">Completed and upcoming team duties.</div><div id="tracker" class="table" style="margin-top:10px"></div></div></section></div><script>const POS=['Pitcher','Catcher','First Base','Second Base','Third Base','Shortstop','Left Field','Left Center Field','Center Field','Right Center Field','Right Field'];const $=id=>document.getElementById(id);let state={};const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});function fmt(e){if(!e.date)return'Date TBD';const d=new Date(e.date+'T12:00');return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+(e.time?' • '+new Date('2000-01-01T'+e.time).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'')}async function load(){try{const r=await fetch('/api/team-state',{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not load live team data');state=j.state||{};$('error').classList.add('hidden');$('updated').textContent=j.updatedAt?'Updated '+new Date(j.updatedAt).toLocaleTimeString():'Live';render()}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden');$('updated').textContent='Offline'}}function render(){$('teamScore').textContent=state.score?.team??0;$('oppScore').textContent=state.score?.opponent??0;$('inning').textContent=state.gameInning??1;$('half').textContent=state.half||'';renderNext();renderLineup();renderKicking();renderEvents();renderTracker()}function renderNext(){const now=today(),arr=[...(state.events||[])].filter(e=>e.date&&e.date>=now).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));const e=arr[0];$('next').innerHTML=e?`<div class="muted">NEXT UP</div><h2 style="margin:.3rem 0">${e.title||e.type}</h2><div>${fmt(e)}</div>${e.location?`<div>📍 ${e.location}</div>`:''}${e.umpire||e.lineRef1||e.lineRef2?`<div style="margin-top:8px"><strong>Officials:</strong> ${[e.umpire&&'Umpire: '+e.umpire,e.lineRef1&&'Line Ref: '+e.lineRef1,e.lineRef2&&'Line Ref: '+e.lineRef2].filter(Boolean).join(' • ')}</div>`:''}`:'<div class="muted">No upcoming events yet.</div>'}function renderLineup(){const n=state.fieldInning||state.gameInning||1,inn=state.innings?.[n]||{};$('lineupLabel').textContent='Inning '+n;const html=POS.map(p=>`<div class="card"><div class="muted">${p}</div><strong>${inn[p]||'Unassigned'}</strong></div>`).join('');$('positions').innerHTML=html;$('homeLineup').innerHTML=html}function renderKicking(){$('kickList').innerHTML=(state.kickingOrder||[]).map((n,i)=>`<div class="card"><strong>${i+1}. ${n}</strong></div>`).join('')||'<div class="card muted">No kicking order posted yet.</div>'}function renderEvents(){const arr=[...(state.events||[])].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));$('events').innerHTML=arr.map(e=>`<div class="card event"><div class="row wrap"><strong>${e.title||e.type}</strong><span class="pill">${e.type||'Event'}</span></div><div class="muted">${fmt(e)}${e.location?' • '+e.location:''}</div>${e.umpire||e.lineRef1||e.lineRef2?`<div style="margin-top:6px">${[e.umpire&&'Umpire: '+e.umpire,e.lineRef1&&'Line Ref 1: '+e.lineRef1,e.lineRef2&&'Line Ref 2: '+e.lineRef2].filter(Boolean).join(' • ')}</div>`:''}</div>`).join('')||'<div class="card muted">No events posted yet.</div>'}function renderTracker(){const t=today(),rows=(state.players||[]).map(p=>({n:p.name,u:0,l:0,d:0,x:0})),m=new Map(rows.map(r=>[r.n,r]));(state.events||[]).filter(e=>e.type==='Officiating'||e.umpire||e.lineRef1||e.lineRef2).forEach(e=>[['umpire','u'],['lineRef1','l'],['lineRef2','l']].forEach(([k,z])=>{const r=m.get(e[k]);if(!r)return;if(e.date&&e.date<t){r[z]++;r.d++}else r.x++}));rows.sort((a,b)=>a.d-b.d||a.x-b.x||a.n.localeCompare(b.n));$('tracker').innerHTML='<div class="tr head"><div>Player</div><div class="num">Umpire</div><div class="num">Line Ref</div><div class="num">Done</div><div class="num">Upcoming</div></div>'+rows.map(r=>`<div class="tr"><div><strong>${r.n}</strong></div><div class="num">${r.u}</div><div class="num">${r.l}</div><div class="num">${r.d}</div><div class="num">${r.x}</div></div>`).join('')}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['home','schedule','lineup','kicking','officials'].forEach(id=>$(id).classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});$('refresh').onclick=load;load();setInterval(load,20000);</script></body></html>
