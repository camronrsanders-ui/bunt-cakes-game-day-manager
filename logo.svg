<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Those Dirty Bunt Cakes</title>
  <desc id="desc">Green, gold and black Bunt Cakes team badge with a bundt cake and red kickball.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe565"/><stop offset="1" stop-color="#d79b00"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39e539"/><stop offset="1" stop-color="#08752d"/></linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b73f"/><stop offset="1" stop-color="#a65a0b"/></linearGradient>
    <radialGradient id="ball" cx="35%" cy="28%" r="70%"><stop offset="0" stop-color="#ff6262"/><stop offset=".5" stop-color="#e6232e"/><stop offset="1" stop-color="#9e0713"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="236" fill="#050505" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="256" cy="256" r="219" fill="none" stroke="#14943d" stroke-width="8"/>
    <circle cx="256" cy="256" r="207" fill="none" stroke="#f3c62b" stroke-width="3" opacity=".8"/>

    <g transform="translate(0 8)">
      <circle cx="256" cy="109" r="54" fill="url(#ball)" stroke="#161616" stroke-width="8"/>
      <path d="M165 165c8-57 43-90 91-90s83 33 91 90l-18 36H183z" fill="url(#cake)" stroke="#111" stroke-width="8"/>
      <path d="M173 160c13-38 41-60 83-60s70 22 83 60c-13-2-20 7-24 23-4 16-20 12-22-1-2-17-15-19-21-2-6 18-22 14-25-3-3-17-19-18-24 0-5 18-21 21-26 2-4-17-17-21-24-3-6 17-20 17-25-1-3-11-8-16-15-15z" fill="#fff7df" stroke="#f3c62b" stroke-width="4"/>
      <ellipse cx="256" cy="139" rx="27" ry="19" fill="#0b0b0b" opacity=".7"/>
      <path d="M156 166l-18 13M351 166l19 13M139 142l-20-5M373 142l20-5" stroke="#f8d64f" stroke-width="9" stroke-linecap="round"/>
    </g>

    <path d="M65 195L447 195 466 238 447 281 65 281 46 238z" fill="#0d7d31" stroke="#f3c62b" stroke-width="8"/>
    <path d="M74 205L438 205 450 238 438 270 74 270 62 238z" fill="#075f27" stroke="#111" stroke-width="4"/>
    <text x="256" y="232" text-anchor="middle" fill="#fff8df" stroke="#111" stroke-width="3" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-size="31" font-weight="900" letter-spacing="1">THOSE DIRTY</text>
    <text x="256" y="277" text-anchor="middle" fill="url(#green)" stroke="#111" stroke-width="5" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-style="italic" font-size="54" font-weight="900" textLength="374" lengthAdjust="spacingAndGlyphs">BUNT CAKES</text>

    <path d="M101 302c53 16 257 16 310 0" fill="none" stroke="#14943d" stroke-width="9" stroke-linecap="round"/>
    <path d="M116 315c62 12 218 12 280 0" fill="none" stroke="#f3c62b" stroke-width="4" stroke-linecap="round"/>

    <text x="256" y="356" text-anchor="middle" fill="#ffd84f" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="800">Sweet, messy, and not</text>
    <text x="256" y="386" text-anchor="middle" fill="#ffd84f" font-family="Trebuchet MS,Arial,sans-serif" font-size="24" font-weight="800">the ones to play with.</text>

    <path d="M140 411c69 24 163 24 232 0" fill="none" stroke="#14943d" stroke-width="6" stroke-linecap="round"/>
    <path d="M171 426c48 12 122 12 170 0" fill="none" stroke="#f3c62b" stroke-width="4" stroke-linecap="round"/>
  </g>
