<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeildHaus Admin</title><meta name="theme-color" content="#071926"><link rel="icon" href="/feildhaus-mark.svg" type="image/svg+xml"><style>:root{--ink:#071926;--mint:#20cfa7;--line:#dbe5e8;--muted:#64748b;--bg:#f6faf9}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#0f172a}.wrap{max-width:1180px;margin:auto;padding:20px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.78rem}.grid{display:grid;gap:10px}.stats{grid-template-columns:repeat(7,minmax(0,1fr));margin-top:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.stat strong{display:block;font-size:1.45rem}.section{margin-top:18px}.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.team-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.team-name{font-weight:900;font-size:1.1rem}.team-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.mini{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px}.mini strong{display:block;font-size:1.05rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:11px;padding:9px 11px;color:inherit;background:#fff;font-weight:800}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.founding{color:#064e3b;background:#d1fae5;border-color:#6ee7b7}.feedback{display:grid;gap:8px}.feedback-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.feedback-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:16px;padding:14px}.hidden{display:none!important}@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.team-grid{grid-template-columns:1fr}}@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.team-meta{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px 10px 60px}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><img src="/feildhaus-mark.svg" alt="FeildHaus"><div><h1 style="margin:0">FeildHaus Admin</h1><div class="muted">Founding Teams Pilot Control Center</div></div></div><div><a class="btn" href="/start">Captain Sign In</a></div></div><div id="error" class="error hidden" style="margin-top:16px"></div><div id="content" class="hidden"><section class="grid stats" id="stats"></section><section class="section"><div class="top"><div><h2 style="margin:.2rem 0">Pilot Teams</h2><div class="muted">Track adoption, game-day use, and feedback across every FeildHaus team.</div></div><button class="btn" id="refresh">Refresh</button></div><div id="teams" class="grid team-grid" style="margin-top:10px"></div></section><section class="section"><h2 style="margin:.2rem 0">Recent Pilot Feedback</h2><div class="muted" style="margin-bottom:10px">Latest feedback from captains and paired players.</div><div id="feedback" class="feedback"></div></section></div></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function fmtDate(v){if(!v)return'No activity yet';const d=new Date(v);return isNaN(d)?v:d.toLocaleString()}async function load(){const err=$('error');err.classList.add('hidden');try{const r=await fetch('/api/admin',{credentials:'include',cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not load FeildHaus Admin');$('content').classList.remove('hidden');const t=j.totals||{};const stats=[['Pilot teams',t.teams||0],['Roster players',t.rosterPlayers||0],['Active players',t.activePlayers||0],['App installs',t.installs||0],['RSVPs',t.rsvpResponses||0],['Upcoming games',t.upcomingGames||0],['Feedback',t.feedback||0]];$('stats').innerHTML=stats.map(([l,v])=>'<div class="stat"><strong>'+v+'</strong><span class="muted">'+esc(l)+'</span></div>').join('');$('teams').innerHTML=(j.teams||[]).map(x=>'<article class="card"><div class="team-head"><div><div class="team-name">'+esc(x.name)+'</div><div class="muted">'+esc(x.organization||x.sport||'Team')+' • '+esc(x.slug)+'</div></div>'+(x.foundingTeam?'<span class="pill founding">🏠 Founding #001</span>':'<span class="pill">'+esc(x.plan||'pilot')+'</span>')+'</div><div class="team-meta"><div class="mini"><strong>'+x.rosterPlayers+'</strong><span class="muted">Roster</span></div><div class="mini"><strong>'+x.activePlayers+'</strong><span class="muted">Active</span></div><div class="mini"><strong>'+x.installs+'</strong><span class="muted">Installs</span></div><div class="mini"><strong>'+x.rsvpResponses+'</strong><span class="muted">RSVPs</span></div><div class="mini"><strong>'+x.upcomingGames+'</strong><span class="muted">Games</span></div><div class="mini"><strong>'+x.feedbackCount+'</strong><span class="muted">Feedback</span></div><div class="mini"><strong>'+x.captainCount+'</strong><span class="muted">Captains</span></div><div class="mini"><strong>'+esc(x.billingStatus||'—')+'</strong><span class="muted">Status</span></div></div><div class="muted" style="margin-top:10px">Updated '+esc(fmtDate(x.updatedAt))+'</div><div class="actions"><a class="btn primary" href="/captain/'+encodeURIComponent(x.slug)+'">Open Captain View</a><a class="btn" href="/team/'+encodeURIComponent(x.slug)+'" target="_blank" rel="noopener">Open Player View</a><button class="btn" type="button" data-copy="'+esc('/team/'+x.slug)+'">Copy Team Link</button></div></article>').join('')||'<div class="card muted">No pilot teams yet.</div>';$('feedback').innerHTML=(j.feedback||[]).map(f=>'<div class="feedback-item"><div class="feedback-top"><div><strong>'+esc(f.team_name)+'</strong> <span class="pill">'+esc(f.category||'feedback')+'</span></div><span class="muted">'+esc(fmtDate(f.created_at))+'</span></div><div style="margin-top:7px">'+esc(f.message||'')+'</div><div class="muted" style="margin-top:5px">'+esc(f.actor||'user')+(f.screen?' • '+esc(f.screen):'')+'</div></div>').join('')||'<div class="card muted">No pilot feedback yet.</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const u=location.origin+b.dataset.copy;try{await navigator.clipboard.writeText(u);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy Team Link',1000)}catch(e){prompt('Copy team link',u)}})}catch(e){$('content').classList.add('hidden');err.textContent=e.message+' — sign in as the Founding Team owner, then reopen /admin.';err.classList.remove('hidden')}}$('refresh').onclick=load;load();</script></body></html>
